<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ページが見つかりません | moneymap</title>
  <meta name="robots" content="noindex" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;background:radial-gradient(circle at 0 0,rgba(23,181,255,.18),transparent 300px),radial-gradient(circle at 100% 40%,rgba(0,206,146,.14),transparent 260px),#f7fbff}
    .card{width:min(420px,90vw);padding:48px 36px;border-radius:24px;background:#fff;box-shadow:0 18px 48px rgba(6,22,79,.1);text-align:center}
    .logo{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;font-size:36px;font-weight:800;color:#06164f;letter-spacing:0;line-height:1}
    .logo strong{color:#08bf6f}
    .logo i{position:relative;display:inline-block;width:14px;height:18px;margin:-5px 0 0 4px;border-radius:12px 12px 12px 0;background:#08bf6f;transform:rotate(42deg)}
    .logo i::after{position:absolute;inset:4px;content:"";border-radius:50%;background:#fff}
    .code{margin:28px 0 8px;font-size:72px;font-weight:800;line-height:1;background:linear-gradient(120deg,#087cff,#08bf6f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    h1{font-size:20px;font-weight:700;color:#0b1f5a;line-height:1.4}
    p{margin:12px 0 28px;color:#52648b;font-size:14px;font-weight:600;line-height:1.7}
    a{display:inline-flex;align-items:center;gap:8px;padding:0 28px;height:52px;border-radius:999px;background:linear-gradient(180deg,#188cff,#005de6);color:#fff;font-size:16px;font-weight:800;text-decoration:none;box-shadow:0 8px 20px rgba(5,91,200,.22)}
  </style>
</head>
<body>
  <div class="card">
    <a href="/" style="display:inline-flex;align-items:flex-start;text-decoration:none" class="logo">
      <span style="color:#06164f;font-family:'Avenir Next','Helvetica Neue',Arial,sans-serif;font-size:36px;font-weight:800">money<strong>map</strong></span><i aria-hidden="true"></i>
    </a>
    <p class="code">404</p>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。<br>トップページからお探しください。</p>
    <a href="/">トップページへ戻る →</a>
  </div>
</body>
</html>
