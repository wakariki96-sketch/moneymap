    <link rel="stylesheet" href="style.css" />

  <body>
    <div class="legal-page-shell">
      <header class="legal-header">
        <a class="legal-logo" href="index.html" aria-label="moneymap ホーム"><span>money</span><strong>map</strong></a>
        <a class="legal-back" href="index.html">トップへ戻る</a>
      </header>

      <main class="legal-content contact-content">
        <h1>お問い合わせ</h1>
        <p class="contact-lead">ご要件を入力して「完了」を押してください。</p>

        <form class="contact-form" action="contact.php" method="post">
          <div class="form-field">
            <label for="name">お名前 <span>任意</span></label>
            <input id="name" name="name" type="text" autocomplete="name" maxlength="80" />
          </div>

          <div class="form-field">
            <label for="email">返信先メールアドレス <span>任意</span></label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="160" />
          </div>

          <div class="form-field">
            <label for="message">ご要件 <strong>必須</strong></label>
            <textarea id="message" name="message" rows="8" required maxlength="3000" placeholder="お問い合わせ内容を入力してください"></textarea>
          </div>

          <input class="form-hidden" type="text" name="website" tabindex="-1" autocomplete="off" />

          <button class="contact-submit" type="submit">完了</button>
        </form>
      </main>

      <footer class="site-footer" aria-label="サイト情報">
